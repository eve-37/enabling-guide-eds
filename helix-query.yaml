version: 1

indices:
  pages:
    include:
      - '/**'
    exclude:
      - '/**.json'
      # Fragment pages mounted by the header and footer blocks. They are not
      # pages in their own right, so keep them out of the index and, through it,
      # out of sitemap.xml and any listing block that reads query-index.
      - '/nav'
      - '/footer'
    target: /query-index.json
    properties:
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
      # Added for the breadcrumb block, which labels each ancestor from here
      # rather than calling AEM. Verified to match the AEM page's jcr:title
      # exactly on published pages.
      title:
        select: head > title
        value: textContent(el)